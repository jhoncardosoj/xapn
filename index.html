<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>xapn® | Em Manutenção</title>

  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Syne:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --p:#678ec2;
      --pl:#8db0dd;
      --pd:#406494;
      --bg:#f4f7fc;
      --ink:#1e293b;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Jost',sans-serif;
      background:linear-gradient(135deg,#678ec2 0%, #406494 100%);
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      position:relative;
      cursor:none;
    }

    .syne{
      font-family:'Syne',sans-serif;
    }

    /* fundo */
    body::before{
      content:'';
      position:absolute;
      inset:0;
      background-image:
      radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
      background-size:40px 40px;
      opacity:.7;
    }

    /* partículas */
    .particles{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }

    .particle{
      position:absolute;
      width:4px;
      height:4px;
      background:rgba(255,255,255,.25);
      border-radius:50%;
      animation:float linear infinite;
    }

    @keyframes float{
      from{
        transform:translateY(100vh);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      to{
        transform:translateY(-20vh);
        opacity:0;
      }
    }

    /* cursor */
    #dot{
      position:fixed;
      width:5px;
      height:5px;
      background:#fff;
      border-radius:50%;
      pointer-events:none;
      z-index:9999;
      transform:translate(-50%,-50%);
    }

    #ring{
      position:fixed;
      width:30px;
      height:30px;
      border:1px solid rgba(255,255,255,.35);
      border-radius:50%;
      pointer-events:none;
      z-index:9998;
      transform:translate(-50%,-50%);
    }

    .container{
      position:relative;
      z-index:2;
      text-align:center;
      width:min(90%,700px);
      padding:3rem;
      animation:fadeUp 1s ease;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    .logo{
      font-size:clamp(4rem,12vw,8rem);
      font-weight:300;
      line-height:1;
      margin-bottom:1rem;
      letter-spacing:-2px;
    }

    .logo .reg{
      font-size:.2em;
      vertical-align:super;
      opacity:.5;
    }

    .badge{
      display:inline-block;
      padding:.5rem 1rem;
      border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(10px);
      font-size:.6rem;
      letter-spacing:.4em;
      text-transform:uppercase;
      margin-bottom:2rem;
    }

    h1{
      font-family:'Syne',sans-serif;
      font-weight:300;
      font-size:clamp(2rem,5vw,4rem);
      line-height:1.1;
      margin-bottom:1.5rem;
    }

    h1 em{
      font-style:normal;
      color:#dbeafe;
    }

    p{
      font-size:.95rem;
      line-height:2;
      color:rgba(255,255,255,.75);
      max-width:580px;
      margin:0 auto;
    }

    .line{
      width:60px;
      height:1px;
      background:rgba(255,255,255,.3);
      margin:2rem auto;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:.8rem;
      margin-top:2rem;
      padding:1rem 2.3rem;
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.3em;
      font-size:.55rem;
      transition:.3s;
    }

    .btn:hover{
      transform:translateY(-3px);
      background:#f4f7fc;
    }

    .footer{
      margin-top:3rem;
      font-size:.55rem;
      letter-spacing:.3em;
      text-transform:uppercase;
      color:rgba(255,255,255,.4);
    }

    @media(max-width:768px){
      body{
        cursor:auto;
      }

      #dot,
      #ring{
        display:none;
      }

      .container{
        padding:2rem;
      }

      p{
        font-size:.85rem;
      }
    }

  </style>
</head>
<body>

<div id="dot"></div>
<div id="ring"></div>

<div class="particles" id="particles"></div>

<div class="container">

  <div class="logo syne">
    xapn<span class="reg">®</span>
  </div>

  <div class="badge">
    manutenção em andamento
  </div>

  <h1>
    Olá xapns,<br>
    estamos em <em>manutenção.</em>
  </h1>

  <div class="line"></div>

  <p>
    Nosso site está passando por alguns ajustes para trazer
    uma experiência ainda melhor pra vocês.
    Em breve estaremos de volta com novidades,
    graça e muito propósito. ✦
  </p>

  <a
    href="https://api.whatsapp.com/send/?phone=82993689706"
    target="_blank"
    class="btn"
  >
    Falar no WhatsApp
  </a>

  <div class="footer">
    xapn® 2026 — vestida de graça
  </div>

</div>

<script>

  // cursor
  const dot = document.getElementById('dot');
  const ring = document.getElementById('ring');

  let mx = 0;
  let my = 0;
  let rx = 0;
  let ry = 0;

  document.addEventListener('mousemove', (e)=>{
    mx = e.clientX;
    my = e.clientY;

    dot.style.left = mx + 'px';
    dot.style.top = my + 'px';
  });

  function animate(){
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;

    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';

    requestAnimationFrame(animate);
  }

  animate();

  // partículas
  const particles = document.getElementById('particles');

  for(let i=0; i<25; i++){

    const p = document.createElement('div');

    p.classList.add('particle');

    p.style.left = Math.random() * 100 + '%';

    p.style.animationDuration =
      (6 + Math.random() * 10) + 's';

    p.style.animationDelay =
      Math.random() * 8 + 's';

    p.style.width =
      p.style.height =
      (2 + Math.random() * 4) + 'px';

    particles.appendChild(p);
  }

</script>

</body>
</html>>
