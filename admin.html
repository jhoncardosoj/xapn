<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>xapn® | Administração</title>

<link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Syne:wght@300;400;500;700&display=swap"
    rel="stylesheet"
>

<style>

:root {
    --blue: #678ec2;
    --dark: #406494;
    --ink: #1e293b;
    --danger: #ff6b6b;
    --success: #25d366;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Jost", sans-serif;
    min-height: 100vh;
    color: white;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--dark)
        );

    padding: 30px;
}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background-image:
        radial-gradient(
            rgba(255,255,255,.08) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;

    opacity: .6;
}

.hidden {
    display: none !important;
}

.syne {
    font-family: "Syne", sans-serif;
}


/* =========================================
   LOGIN
========================================= */

.login {

    position: relative;

    z-index: 2;

    width: min(430px, 100%);

    margin: 10vh auto;

    padding: 35px;

    border:
        1px solid
        rgba(255,255,255,.2);

    background:
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(18px);

    border-radius: 22px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.12);
}

.logo {

    text-align: center;

    font-family:
        "Syne",
        sans-serif;

    font-size: 2.5rem;

    margin-bottom: 8px;

    font-weight: 300;
}

.logo sup {

    font-size: .4em;

    vertical-align:
        super;

    opacity: .6;
}

.subtitle {

    text-align: center;

    color:
        rgba(255,255,255,.65);

    margin-bottom: 30px;
}


/* =========================================
   INPUTS
========================================= */

input,
textarea,
select {

    width: 100%;

    padding: 13px 14px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.08);

    color: white;

    border-radius: 10px;

    margin-bottom: 13px;

    outline: none;

    font-family: inherit;

    transition: .2s;
}

input:focus,
textarea:focus,
select:focus {

    border-color:
        rgba(255,255,255,.45);

    background:
        rgba(255,255,255,.12);
}

input::placeholder,
textarea::placeholder {

    color:
        rgba(255,255,255,.5);
}

textarea {

    min-height: 100px;

    resize: vertical;
}


/* =========================================
   BUTTON
========================================= */

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: white;

    color: var(--ink);

    font-weight: 600;

    cursor: pointer;

    transition: .2s;

    font-family: inherit;
}

button:hover {

    transform:
        translateY(-1px);
}

button:disabled {

    opacity: .55;

    cursor: not-allowed;

    transform: none;
}


/* =========================================
   DASHBOARD
========================================= */

.dashboard {

    position: relative;

    z-index: 2;

    width:
        min(1100px, 100%);

    margin: auto;
}

.topbar {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 30px;

    padding: 20px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 18px;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.08);
}

.topbar h1 {

    font-weight: 300;
}

.logout {

    width: auto;

    background:
        rgba(255,255,255,.12);

    color: white;

    border:
        1px solid
        rgba(255,255,255,.2);

    padding:
        9px 18px;
}


/* =========================================
   GRID
========================================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(320px, 1fr)
        );

    gap: 20px;
}

.panel {

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(15px);

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.08);
}

.panel h2 {

    font-family:
        "Syne",
        sans-serif;

    font-weight: 400;

    margin-bottom: 18px;
}


/* =========================================
   SELETOR DE IMAGEM
========================================= */

.image-source {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-bottom: 12px;
}

.image-source button {

    padding: 11px;

    background:
        rgba(255,255,255,.08);

    color: white;

    border:
        1px solid
        rgba(255,255,255,.18);

    font-size: .78rem;

    font-weight: 500;
}

.image-source button.active {

    background: white;

    color: var(--ink);

    border-color: white;
}


/* =========================================
   ARQUIVO
========================================= */

.file-box {

    position: relative;

    border:
        1px dashed
        rgba(255,255,255,.3);

    border-radius: 12px;

    padding: 18px;

    text-align: center;

    margin-bottom: 12px;

    background:
        rgba(255,255,255,.04);

    transition: .2s;
}

.file-box:hover {

    background:
        rgba(255,255,255,.09);

    border-color:
        rgba(255,255,255,.55);
}

.file-box label {

    display: block;

    cursor: pointer;

    font-size: .82rem;

    color:
        rgba(255,255,255,.85);
}

.file-box strong {

    display: block;

    font-size: 1rem;

    margin-bottom: 4px;
}

.file-box small {

    color:
        rgba(255,255,255,.55);
}

.file-input {

    display: none;
}


/* =========================================
   PREVIEW
========================================= */

.preview {

    width: 100%;

    max-height: 240px;

    object-fit: cover;

    border-radius: 12px;

    margin:
        5px 0 15px;

    display: none;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(0,0,0,.15);
}


/* =========================================
   LISTA
========================================= */

.product-list {

    margin-top: 25px;
}

.item {

    display: flex;

    gap: 12px;

    align-items: center;

    padding: 12px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.item:last-child {

    border-bottom: none;
}

.item img {

    width: 60px;

    height: 60px;

    object-fit: cover;

    border-radius: 8px;

    background:
        rgba(255,255,255,.08);

    flex-shrink: 0;
}

.item-info {

    flex: 1;

    min-width: 0;
}

.item-title {

    font-size: .9rem;

    word-break: break-word;
}

.item-price {

    font-size: .78rem;

    color:
        #dbeafe;

    margin-top: 3px;
}

.item-actions {

    display: flex;

    gap: 6px;

    flex-shrink: 0;
}

.item-actions button {

    width: auto;

    padding:
        7px 10px;

    font-size:
        .7rem;
}

.edit {

    background:
        rgba(255,255,255,.15);

    color: white;
}

.delete {

    background:
        var(--danger);

    color: white;
}


/* =========================================
   STATUS
========================================= */

.status {

    margin-top: 12px;

    font-size: .8rem;

    min-height: 20px;

    line-height: 1.5;
}

.success {

    color:
        #b7f7c5;
}

.error {

    color:
        #ffd0d0;
}

.info {

    color:
        rgba(255,255,255,.75);
}


/* =========================================
   LABEL
========================================= */

.source-label {

    font-size: .72rem;

    text-transform:
        uppercase;

    letter-spacing:
        .12em;

    color:
        rgba(255,255,255,.55);

    margin:
        4px 0 8px;
}


/* =========================================
   SEPARADOR
========================================= */

.form-divider {

    height: 1px;

    background:
        rgba(255,255,255,.08);

    margin:
        20px 0;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    body {

        padding: 15px;
    }

    .topbar {

        flex-direction:
            column;

        gap: 15px;

        align-items:
            flex-start;
    }

    .logout {

        width: 100%;
    }

    .item {

        align-items:
            flex-start;

        flex-wrap: wrap;
    }

    .item-info {

        width:
            calc(100% - 75px);
    }

    .item-actions {

        width: 100%;

        margin-left: 72px;
    }

    .item-actions button {

        flex: 1;
    }

}

</style>

</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<section
    class="login"
    id="login-screen"
>

    <div class="logo">

        xapn<sup>®</sup>

    </div>

    <div class="subtitle">

        Painel administrativo

    </div>


    <input
        type="email"
        id="login-email"
        placeholder="E-mail"
        autocomplete="username"
    >


    <input
        type="password"
        id="login-password"
        placeholder="Senha"
        autocomplete="current-password"
    >


    <button
        id="login-button"
    >

        Entrar

    </button>


    <div
        class="status"
        id="login-status"
    ></div>

</section>



<!-- =========================================
     DASHBOARD
========================================= -->

<main
    class="dashboard hidden"
    id="dashboard"
>


    <div class="topbar">

        <div>

            <div
                class="syne"
                style="font-size:1.6rem"
            >

                xapn<sup>®</sup>

            </div>

            <div
                style="
                    color:rgba(255,255,255,.6);
                    font-size:.8rem;
                "
            >

                Painel administrativo

            </div>

        </div>


        <button
            class="logout"
            id="logout-button"
        >

            Sair

        </button>

    </div>



    <div class="grid">


        <!-- =================================
             PRODUTOS
        ================================== -->

        <section class="panel">

            <h2>

                Produtos

            </h2>


            <form
                id="product-form"
            >

                <input
                    type="hidden"
                    id="product-id"
                >


                <input
                    type="text"
                    id="product-title"
                    placeholder="Nome da camiseta"
                    required
                >


                <input
                    type="number"
                    id="product-price"
                    placeholder="Preço"
                    step="0.01"
                    min="0"
                    required
                >


                <textarea
                    id="product-description"
                    placeholder="Descrição"
                ></textarea>


                <input
                    type="number"
                    id="product-order"
                    placeholder="Ordem do produto (ex.: 1)"
                    min="0"
                >


                <div class="source-label">

                    Imagem do produto

                </div>


                <div class="image-source">

                    <button
                        type="button"
                        id="product-url-mode"
                        class="active"
                    >

                        🔗 URL

                    </button>


                    <button
                        type="button"
                        id="product-file-mode"
                    >

                        🖼️ Galeria

                    </button>

                </div>


                <div id="product-url-area">

                    <input
                        type="text"
                        id="product-img"
                        placeholder="Cole a URL da imagem"
                    >

                </div>


                <div
                    id="product-file-area"
                    class="hidden"
                >

                    <div class="file-box">

                        <label
                            for="product-file"
                        >

                            <strong>

                                🖼️ Escolher imagem

                            </strong>

                            <small>

                                Galeria, fotos ou arquivos do dispositivo

                            </small>

                        </label>


                        <input
                            class="file-input"
                            type="file"
                            id="product-file"
                            accept="image/*"
                        >

                    </div>

                </div>


                <img
                    class="preview"
                    id="product-preview"
                    alt="Prévia da imagem do produto"
                >


                <button
                    type="submit"
                    id="product-submit"
                >

                    Adicionar produto

                </button>


                <button
                    type="button"
                    id="product-cancel"
                    class="hidden"
                    style="
                        margin-top:8px;
                        background:rgba(255,255,255,.12);
                        color:white;
                    "
                >

                    Cancelar edição

                </button>


                <div
                    class="status"
                    id="product-status"
                ></div>

            </form>


            <div
                class="product-list"
                id="product-list"
            ></div>

        </section>



        <!-- =================================
             CARROSSEL
        ================================== -->

        <section class="panel">

            <h2>

                Carrossel

            </h2>


            <form
                id="carousel-form"
            >

                <input
                    type="hidden"
                    id="carousel-id"
                >


                <input
                    type="text"
                    id="carousel-badge"
                    placeholder="Badge (ex.: XAPN)"
                >


                <input
                    type="text"
                    id="carousel-title"
                    placeholder="Título do slide"
                    required
                >


                <textarea
                    id="carousel-description"
                    placeholder="Descrição do slide"
                ></textarea>


                <input
                    type="text"
                    id="carousel-button"
                    placeholder="Texto do botão"
                    value="Ver coleção"
                >


                <input
                    type="number"
                    id="carousel-order"
                    placeholder="Ordem do slide (ex.: 1)"
                    min="0"
                >


                <div class="source-label">

                    Imagem do carrossel

                </div>


                <div class="image-source">

                    <button
                        type="button"
                        id="carousel-url-mode"
                        class="active"
                    >

                        🔗 URL

                    </button>


                    <button
                        type="button"
                        id="carousel-file-mode"
                    >

                        🖼️ Galeria

                    </button>

                </div>


                <div id="carousel-url-area">

                    <input
                        type="text"
                        id="carousel-img"
                        placeholder="Cole a URL da imagem"
                    >

                </div>


                <div
                    id="carousel-file-area"
                    class="hidden"
                >

                    <div class="file-box">

                        <label
                            for="carousel-file"
                        >

                            <strong>

                                🖼️ Escolher imagem

                            </strong>

                            <small>

                                Galeria, fotos ou arquivos do dispositivo

                            </small>

                        </label>


                        <input
                            class="file-input"
                            type="file"
                            id="carousel-file"
                            accept="image/*"
                        >

                    </div>

                </div>


                <img
                    class="preview"
                    id="carousel-preview"
                    alt="Prévia da imagem do carrossel"
                >


                <button
                    type="submit"
                    id="carousel-submit"
                >

                    Adicionar slide

                </button>


                <button
                    type="button"
                    id="carousel-cancel"
                    class="hidden"
                    style="
                        margin-top:8px;
                        background:rgba(255,255,255,.12);
                        color:white;
                    "
                >

                    Cancelar edição

                </button>


                <div
                    class="status"
                    id="carousel-status"
                ></div>

            </form>


            <div
                class="product-list"
                id="carousel-list"
            ></div>

        </section>

    </div>

</main>



<script
    type="module"
    src="./admin.js"
></script>


</body>

</html>
