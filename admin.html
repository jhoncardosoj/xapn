<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xapn® | Painel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Syne:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --p: #678ec2; --pd: #406494; --ink: #1e293b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Jost', sans-serif; background: linear-gradient(135deg, #678ec2, #406494); color: #fff; min-height: 100vh; padding: 30px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1, h2 { font-family: 'Syne', sans-serif; font-weight: 300; margin-bottom: 20px; }
    
    .card-box { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px; padding: 25px; backdrop-filter: blur(10px); margin-bottom: 30px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.2); color: #fff; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: #fff; }
    
    button { padding: 12px 24px; background: #fff; color: var(--ink); border: none; border-radius: 8px; font-weight: 500; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.15em; transition: 0.2s; }
    button:hover { background: #dbeafe; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    .item-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .item-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .hidden { display: none !important; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="login-section" class="card-box">
      <h1>Acesso Restrito xapn®</h1>
      <form id="login-form">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>

    <div id="admin-panel" class="hidden">
      <div class="header-actions">
        <h1>Painel de Controle</h1>
        <button id="btn-logout" class="btn-danger">Sair</button>
      </div>

      <!-- Alterar Imagem da Seção Sobre -->
      <div class="card-box">
        <h2>Imagem da Seção "Mais do que uma camiseta"</h2>
        <form id="about-form">
          <div class="form-group">
            <label>URL da Imagem</label>
            <input type="url" id="about-img-input" placeholder="https://..." required>
          </div>
          <button type="submit">Atualizar Foto Sobre</button>
        </form>
      </div>

      <!-- Gerenciar Banners -->
      <div class="card-box">
        <h2>Adicionar Banner ao Carrossel</h2>
        <form id="banner-form">
          <div class="form-group">
            <label>Badge (ex: Nova coleção)</label>
            <input type="text" id="b-badge" required>
          </div>
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="b-title" required>
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="b-desc" rows="2" required></textarea>
          </div>
          <div class="form-group">
            <label>Texto do Botão (ex: Ver coleção)</label>
            <input type="text" id="b-btnText" value="Ver coleção" required>
          </div>
          <div class="form-group">
            <label>URL da Imagem</label>
            <input type="url" id="b-img" placeholder="https://..." required>
          </div>
          <button type="submit">Cadastrar Banner</button>
        </form>

        <h3 style="margin-top: 20px;">Banners Cadastrados</h3>
        <div id="banners-list" class="admin-grid"></div>
      </div>

      <!-- Gerenciar Produtos -->
      <div class="card-box">
        <h2>Adicionar Produto</h2>
        <form id="product-form">
          <div class="form-group">
            <label>Nome do Produto</label>
            <input type="text" id="p-name" required>
          </div>
          <div class="form-group">
            <label>Preço (R$)</label>
            <input type="number" step="0.01" id="p-price" required>
          </div>
          <div class="form-group">
            <label>URL da Imagem</label>
            <input type="url" id="p-img" placeholder="https://..." required>
          </div>
          <button type="submit">Cadastrar Produto</button>
        </form>

        <h3 style="margin-top: 20px;">Produtos Cadastrados</h3>
        <div id="products-list" class="admin-grid"></div>
      </div>

    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
