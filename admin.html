/* =========================
   LOGIN
========================= */

  margin: 10vh auto;

}

/* =========================
   INPUTS
========================= */

input,

    rgba(255,255,255,.08);

  outline: none;

}

========================= */

<!--
==================================================
SISTEMA DE IMAGENS
NÃO SUBSTITUI O admin.js

Este sistema apenas prepara a imagem.
O admin.js continua responsável pelo Firebase.
==================================================
-->

<script>

(function () {

  /* ==========================================
     COMPRESSOR DE IMAGEM
  ========================================== */

  function compressImage(file, maxWidth = 900, quality = 0.72) {

    return new Promise((resolve, reject) => {

      if (!file || !file.type.startsWith("image/")) {

        reject(
          new Error("Selecione uma imagem válida.")
        );

        return;

      }

      const reader = new FileReader();

      reader.onload = function (event) {

        const img = new Image();

        img.onload = function () {

          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {

            const ratio =
              maxWidth / width;

            width = maxWidth;
            height =
              Math.round(
                height * ratio
              );

          }

          const canvas =
            document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          const compressed =
            canvas.toDataURL(
              "image/jpeg",
              quality
            );

          resolve(compressed);

        };

        img.onerror = function () {

          reject(
            new Error(
              "Não foi possível processar a imagem."
            )
          );

        };

        img.src =
          event.target.result;

      };

      reader.onerror = function () {

        reject(
          new Error(
            "Não foi possível ler o arquivo."
          )
        );

      };

      reader.readAsDataURL(file);

    });

  }


  /* ==========================================
     PRODUTO
  ========================================== */

  const productUrlMode =
    document.getElementById(
      "product-url-mode"
    );

  const productFileMode =
    document.getElementById(
      "product-file-mode"
    );

  const productUrlArea =
    document.getElementById(
      "product-url-area"
    );

  const productFileArea =
    document.getElementById(
      "product-file-area"
    );

  const productFile =
    document.getElementById(
      "product-file"
    );

  const productImg =
    document.getElementById(
      "product-img"
    );

  const productPreview =
    document.getElementById(
      "product-preview"
    );


  productUrlMode.addEventListener(
    "click",
    function () {

      productUrlMode.classList.add(
        "active"
      );

      productFileMode.classList.remove(
        "active"
      );

      productUrlArea.classList.remove(
        "hidden"
      );

      productFileArea.classList.add(
        "hidden"
      );

    }
  );


  productFileMode.addEventListener(
    "click",
    function () {

      productFileMode.classList.add(
        "active"
      );

      productUrlMode.classList.remove(
        "active"
      );

      productUrlArea.classList.add(
        "hidden"
      );

      productFileArea.classList.remove(
        "hidden"
      );

    }
  );


  productImg.addEventListener(
    "input",
    function () {

      const url =
        productImg.value.trim();

      if (!url) {

        productPreview.style.display =
          "none";

        return;

      }

      productPreview.src = url;

      productPreview.style.display =
        "block";

    }
  );


  productFile.addEventListener(
    "change",
    async function () {

      const file =
        productFile.files[0];

      if (!file) return;

      try {

        productPreview.style.display =
          "block";

        productPreview.style.opacity =
          ".5";

        const compressed =
          await compressImage(file);

        productImg.value =
          compressed;

        productPreview.src =
          compressed;

        productPreview.style.opacity =
          "1";

      } catch (error) {

        alert(
          error.message
        );

        productFile.value = "";

      }

    }
  );


  /* ==========================================
     CARROSSEL
  ========================================== */

  const carouselUrlMode =
    document.getElementById(
      "carousel-url-mode"
    );

  const carouselFileMode =
    document.getElementById(
      "carousel-file-mode"
    );

  const carouselUrlArea =
    document.getElementById(
      "carousel-url-area"
    );

  const carouselFileArea =
    document.getElementById(
      "carousel-file-area"
    );

  const carouselFile =
    document.getElementById(
      "carousel-file"
    );

  const carouselImg =
    document.getElementById(
      "carousel-img"
    );

  const carouselPreview =
    document.getElementById(
      "carousel-preview"
    );


  carouselUrlMode.addEventListener(
    "click",
    function () {

      carouselUrlMode.classList.add(
        "active"
      );

      carouselFileMode.classList.remove(
        "active"
      );

      carouselUrlArea.classList.remove(
        "hidden"
      );

      carouselFileArea.classList.add(
        "hidden"
      );

    }
  );


  carouselFileMode.addEventListener(
    "click",
    function () {

      carouselFileMode.classList.add(
        "active"
      );

      carouselUrlMode.classList.remove(
        "active"
      );

      carouselUrlArea.classList.add(
        "hidden"
      );

      carouselFileArea.classList.remove(
        "hidden"
      );

    }
  );


  carouselImg.addEventListener(
    "input",
    function () {

      const url =
        carouselImg.value.trim();

      if (!url) {

        carouselPreview.style.display =
          "none";

        return;

      }

      carouselPreview.src =
        url;

      carouselPreview.style.display =
        "block";

    }
  );


  carouselFile.addEventListener(
    "change",
    async function () {

      const file =
        carouselFile.files[0];

      if (!file) return;

      try {

        carouselPreview.style.display =
          "block";

        carouselPreview.style.opacity =
          ".5";

        const compressed =
          await compressImage(
            file,
            1200,
            0.72
          );

        carouselImg.value =
          compressed;

        carouselPreview.src =
          compressed;

        carouselPreview.style.opacity =
          "1";

      } catch (error) {

        alert(
          error.message
        );

        carouselFile.value = "";

      }

    }
  );


  /* ==========================================
     TRATAMENTO DO PREVIEW
  ========================================== */

  productPreview.addEventListener(
    "error",
    function () {

      this.style.display =
        "none";

    }
  );


  carouselPreview.addEventListener(
    "error",
    function () {

      this.style.display =
        "none";

    }
  );


})();

</script>
